{% extends "base.html" %}
{% block title %}Nouvelle Édition{% endblock %}
{% block content %}
<div class="container-fluid px-3">
  <h2 class="page-title"><i class="bi bi-calendar3 text-green"></i> Nouvelle Édition</h2>
  <div class="card border-0 shadow-sm" style="max-width:500px;">
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Année *</label>
          <input type="number" name="annee" class="form-control" required
                 min="2020" max="2099" placeholder="2025">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Libellé</label>
          <input type="text" name="libelle" class="form-control"
                 placeholder="Grand Magal de Touba Edition 2025">
        </div>
        <div class="mb-3 form-check form-switch">
          <input class="form-check-input" type="checkbox" name="active" id="active">
          <label class="form-check-label" for="active">Définir comme édition active</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> Créer
          </button>
          <a href="{{ url_for('admin.liste_editions') }}" class="btn btn-outline-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
