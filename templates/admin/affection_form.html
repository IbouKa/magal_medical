{% extends "base.html" %}
{% block title %}{{ action }} Affection{% endblock %}

{% block content %}
<div class="container-fluid px-3">
  <h2 class="page-title">
    <i class="bi bi-virus2 text-green"></i>
    {{ action }} une Affection
  </h2>

  <div class="card border-0 shadow-sm" style="max-width: 640px;">
    <div class="card-body p-4">
      <form method="POST">

        <div class="row g-3">

          <!-- Numéro -->
          <div class="col-md-4">
            <label class="form-label fw-semibold" for="numero">
              Numéro <span class="text-danger">*</span>
            </label>
            <input
              type="number"
              id="numero"
              name="numero"
              class="form-control"
              required
              min="1"
              value="{{ affection.numero if affection else next_num }}"
              placeholder="Ex. 1">
            <div class="form-text">Ordre d'affichage dans les fiches.</div>
          </div>

          <!-- Libellé -->
          <div class="col-md-8">
            <label class="form-label fw-semibold" for="libelle">
              Libellé <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="libelle"
              name="libelle"
              class="form-control"
              required
              maxlength="200"
              value="{{ affection.libelle if affection else '' }}"
              placeholder="Ex. Paludisme simple">
          </div>

          <!-- Catégorie -->
          <div class="col-md-8">
            <label class="form-label fw-semibold" for="categorie">Catégorie</label>
            <select id="categorie" name="categorie" class="form-select">
              {% for val, label in categories %}
              <option value="{{ val }}"
                {% if affection and affection.categorie == val %}selected
                {% elif not affection and val == 'autres' %}selected
                {% endif %}>
                {{ label }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Cases à cocher -->
          <div class="col-12">
            <div class="d-flex flex-column gap-2">

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="is_mpe"
                  name="is_mpe"
                  {% if affection and affection.is_mpe %}checked{% endif %}>
                <label class="form-check-label" for="is_mpe">
                  <span class="badge bg-danger me-1"><i class="bi bi-exclamation-triangle-fill"></i> MPE</span>
                  Maladie à Potentiel Épidémique
                </label>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="actif"
                  name="actif"
                  {% if not affection or affection.actif %}checked{% endif %}>
                <label class="form-check-label" for="actif">
                  Affection active
                  <span class="text-muted small">(visible dans les fiches de saisie)</span>
                </label>
              </div>

            </div>
          </div>

        </div><!-- /row -->

        <!-- Boutons -->
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle-fill"></i> {{ action }}
          </button>
          <a href="{{ url_for('admin.liste_affections') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Annuler
          </a>
        </div>

      </form>
    </div>
  </div>

  {% if affection %}
  <div class="mt-3 text-muted small">
    ID interne : {{ affection.id }}
    &nbsp;·&nbsp;
    Numéro actuel : {{ affection.numero }}
  </div>
  {% endif %}

</div>
{% endblock %}
