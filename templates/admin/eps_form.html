{% extends "base.html" %}
{% block title %}{{ action }} EPS{% endblock %}
{% block content %}
<div class="container-fluid px-3">
  <h2 class="page-title"><i class="bi bi-building text-green"></i> {{ action }} une Structure EPS</h2>
  <div class="card border-0 shadow-sm" style="max-width:640px;">
    <div class="card-body p-4">
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nom de la structure *</label>
            <input type="text" name="nom" class="form-control" required
                   value="{{ eps.nom if eps else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Code</label>
            <input type="text" name="code" class="form-control"
                   value="{{ eps.code if eps else '' }}" placeholder="EPS001">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Type *</label>
            <select name="type_eps" class="form-select" required>
              <option value="poste_sante" {% if eps and eps.type_eps=='poste_sante' %}selected{% endif %}>Poste de Santé</option>
              <option value="centre_sante" {% if eps and eps.type_eps=='centre_sante' %}selected{% endif %}>Centre de Santé</option>
              <option value="hopital" {% if eps and eps.type_eps=='hopital' %}selected{% endif %}>Hôpital</option>
              <option value="district" {% if eps and eps.type_eps=='district' %}selected{% endif %}>District Sanitaire</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">District / Zone *</label>
            <select name="district_id" class="form-select" required>
              <option value="">-- Sélectionner --</option>
              {% for d in districts %}
              <option value="{{ d.id }}" {% if eps and eps.district_id == d.id %}selected{% endif %}>{{ d.nom }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Responsable</label>
            <input type="text" name="responsable" class="form-control"
                   value="{{ eps.responsable if eps else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Téléphone</label>
            <input type="text" name="telephone" class="form-control"
                   value="{{ eps.telephone if eps else '' }}">
          </div>
          {% if eps %}
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="actif" id="actif"
                     {% if eps.actif %}checked{% endif %}>
              <label class="form-check-label" for="actif">Structure active</label>
            </div>
          </div>
          {% endif %}
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle"></i> {{ action }}
          </button>
          <a href="{{ url_for('admin.liste_eps') }}" class="btn btn-outline-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
