{% extends "base.html" %}
{% block title %}Changer le mot de passe{% endblock %}
{% block content %}
<div class="card mx-auto mt-4" style="max-width:480px;">
  <div class="card-header card-header-green">
    <i class="bi bi-key-fill"></i> Changer le mot de passe
  </div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Mot de passe actuel</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nouveau mot de passe</label>
        <input type="password" name="new_password" class="form-control" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmer le nouveau mot de passe</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle"></i> Soumettre
        </button>
        <a href="{{ url_for('admin.dashboard') if current_user.is_admin else url_for('user.dashboard') }}"
           class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
